name: Audit date collection (no notification)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install existing dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Audit bounded public requests without changing stored state
        run: python -m contest_alert audit
      - name: Show source quality
        if: always()
        run: |
          if [ -f .runtime/quality.md ]; then
            cat .runtime/quality.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Save diagnostic report only (no raw pages or credentials)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: date-quality-audit
          path: |
            .runtime/quality.json
            .runtime/quality.md
          retention-days: 7
          if-no-files-found: ignore
