name: Daily contest dashboard
on:
  schedule:
    # Keep the original noon trigger, plus lightweight setting-aware ticks.
    - cron: '40 2 * * *'
    - cron: '3,23,43 * * * *'
  workflow_dispatch:
    inputs:
      send_today:
        description: '오늘 알림도 보내기 (즉시 시험 발송, 당일 이미 시도했으면 생략)'
        required: false
        type: boolean
        default: false
concurrency:
  group: contest-daily-state
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: write
    outputs:
      site_ready: ${{ steps.upload.outcome == 'success' }}
    env:
      PAGE_URL: ${{ vars.PAGE_URL }}
      ENABLE_PAGES: ${{ vars.ENABLE_PAGES }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Read latest code and state
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - name: Verify complete release before importing anything
        run: python tools/preflight.py
      - name: Check selected notification time
        id: gate
        run: python tools/schedule_gate.py
      - name: Set up Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Offline tests and release imports
        id: tests
        if: steps.gate.outputs.run == 'true'
        run: |
          python tools/preflight.py --imports
          python -m unittest discover -s tests -v
          python tools/smoke.py
      - name: Collect notices and build dashboard
        id: collect
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        env:
          COLLECT_MODE: ${{ github.event_name == 'schedule' && 'scheduled' || 'manual' }}
        run: python -m contest_alert collect --mode "$COLLECT_MODE"
      - name: Persist failed collection metadata without replacing old records
        id: persist_failure
        if: always() && steps.collect.outcome == 'failure'
        run: python tools/persist.py
      - name: Reserve one daily notification
        id: reserve
        continue-on-error: true
        if: steps.collect.outcome == 'success' && (github.event_name == 'schedule' || inputs.send_today == true)
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NOTIFY_MODE: ${{ github.event_name == 'schedule' && 'scheduled' || 'manual' }}
          CM_TARGET_DAY: ${{ steps.gate.outputs.day }}
        run: python -m contest_alert prepare --mode "$NOTIFY_MODE"
      - name: Persist reservation before posting
        id: persist
        if: steps.collect.outcome == 'success'
        run: python tools/persist.py
      - name: Submit or schedule one ntfy digest
        id: notify
        if: steps.persist.outcome == 'success' && steps.reserve.outputs.send == 'true'
        continue-on-error: true
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python -m contest_alert send
      - name: Save notification outcome
        if: always() && steps.reserve.outputs.send == 'true' && steps.notify.outcome != 'skipped'
        run: python tools/persist.py
      - name: Upload public website
        id: upload
        if: always() && steps.tests.outcome == 'success' && steps.gate.outputs.run == 'true' && vars.ENABLE_PAGES != 'false' && (steps.persist.outcome == 'success' || steps.persist_failure.outcome == 'success')
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
          retention-days: 1
      - name: Surface collection or notification errors
        if: always() && (steps.collect.outcome == 'failure' || steps.notify.outcome == 'failure' || steps.reserve.outcome == 'failure')
        run: |
          echo 'Collection or notification failed. Previous state was retained; inspect the summary.'
          exit 1

  deploy:
    needs: update
    if: always() && vars.ENABLE_PAGES != 'false' && needs.update.outputs.site_ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
