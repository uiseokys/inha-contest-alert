name: Apply page request (owner only)
on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: '재시도할 소유자 본인 작성 요청 이슈 번호'
        required: true
        type: string
concurrency:
  group: contest-daily-state
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  apply:
    if: github.actor == github.repository_owner && (github.event_name == 'workflow_dispatch' || github.event.issue.user.login == github.repository_owner)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
      issues: read
    outputs:
      site_ready: ${{ steps.upload.outcome == 'success' }}
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      PAGE_URL: ${{ vars.PAGE_URL }}
      ENABLE_PAGES: ${{ vars.ENABLE_PAGES }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - run: python tools/preflight.py
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Verify code without issuing any notification
        run: |
          python tools/preflight.py --imports
          python -m unittest discover -s tests
      - name: Validate owner and parse request as data
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_NUMBER: ${{ inputs.issue_number }}
        run: python tools/handle_request.py
      - name: Rebuild from saved data, without fetching or notifying
        if: steps.request.outputs.ready == 'true'
        run: python -m contest_alert render
      - name: Save server configuration and public page
        if: steps.request.outputs.ready == 'true'
        run: python tools/persist.py
      - name: Upload public page
        id: upload
        if: steps.request.outputs.ready == 'true' && vars.ENABLE_PAGES != 'false'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
          retention-days: 1
  deploy:
    needs: apply
    if: needs.apply.outputs.site_ready == 'true' && vars.ENABLE_PAGES != 'false'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
